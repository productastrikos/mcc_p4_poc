<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Miri FloodSense: AI flood early warning for the Miri Smart City Command Centre, Miri City Council (Majlis Bandaraya Miri)" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/mcc-logo.svg" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <title>Miri FloodSense · Miri City Council</title>
</head>
<body>
  <script>
    /* Theme before first paint (same rule as initTheme in src/theme/ThemeProvider.js) */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('astrikos-theme'); } catch (e) {}
      var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.body.setAttribute('data-theme', saved || (light ? 'light' : 'dark'));
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
